<ion-content class="ion-padding">
  <div class="form-wrapper">
    <ion-item>
      <ion-label position="floating">Correo electrónico</ion-label>
      <ion-input type="email" [(ngModel)]="correo"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Mensaje</ion-label>
      <ion-textarea rows="5" [(ngModel)]="mensaje"></ion-textarea>
    </ion-item>

    <ion-button expand="block" (click)="enviar()">Enviar</ion-button>

    <p *ngIf="enviado" class="success-message">Mensaje guardado localmente.</p>

    <div *ngIf="ultimoMensaje" class="last-message">
      <h3>Último mensaje guardado</h3>
      <p><strong>Correo:</strong> {{ ultimoMensaje.correo }}</p>
      <p><strong>Mensaje:</strong> {{ ultimoMensaje.mensaje }}</p>
    </div>
  </div>
</ion-content>
